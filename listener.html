<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Listener</title>
        <style>
            body {
                width: 90%;
                margin: 0 auto;
                margin-top: 1rem;
            }
            #text {
                width: 100%;
                height: 50vh;
            }
        </style>
        <script src="listener.js" defer></script>
    </head>
    <body style="background-color:#1e1d1d">
        <textarea style="background-color: #2A2A2A; color: #e4dede;" id="text" placeholder="Type..."></textarea>
        <button type="button" id="playbutton">Play</button>
        <button type="button" id="stopbutton">Stop</button>
        <button type="button" id="restartbutton">Restart</button>
        <h1 style="color: #E0E0E0; background-color: #1E1E1E;" id="highlight"></h1>
        <h2 style="text-align: right; color: #E0E0E0; background-color: #1E1E1E;" id="expected"></h2>
        <button style="display: block; margin-left: auto;" type="button" id="skipbutton">Skip</button>
    </body>
</html>
